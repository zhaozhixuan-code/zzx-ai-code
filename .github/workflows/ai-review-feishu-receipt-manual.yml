name: AI review Feishu receipt (manual)

on:
  workflow_dispatch:

permissions: {}

jobs:
  archive:
    if: github.ref == 'refs/heads/master'
    runs-on: ai-commit-review
    timeout-minutes: 10
    steps:
      - name: Verify the prepared receipt
        shell: bash
        env:
          RECEIPT: /var/lib/ai-review-runner/receipt-input/receipt.json
          RECEIPT_SHA256: d12676e91e60b965d4c2fcc1f7493483b6fc1d31f9cfb75d4dc7a8d9d56907e1
        run: |
          set -euo pipefail
          test -f "$RECEIPT" && test ! -L "$RECEIPT"
          printf '%s  %s\n' "$RECEIPT_SHA256" "$RECEIPT" | sha256sum -c -

      - name: Upload the existing receipt
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-review-feishu-receipt-44447086107
          path: /var/lib/ai-review-runner/receipt-input/receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Download the receipt from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-review-feishu-receipt-44447086107
          path: ${{ runner.temp }}/ai-review-receipt-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Compare the archived receipt to the source
        shell: bash
        env:
          DOWNLOADED: ${{ runner.temp }}/ai-review-receipt-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          cmp -- /var/lib/ai-review-runner/receipt-input/receipt.json "$DOWNLOADED"
          sha256sum -- "$DOWNLOADED"
          printf 'Verified receipt artifact: %s\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
