name: AI commit review

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  review:
    if: >-
      github.repository == 'zhaozhixuan-code/zzx-ai-code' && !github.event.deleted &&
      vars.AI_REVIEW_RUN_MODEL == 'true' && vars.AI_REVIEW_MASTER_ENABLED == 'true'
    runs-on: ai-commit-review
    timeout-minutes: 360
    env:
      SEND_FEISHU: ${{ github.run_attempt == 1 && vars.AI_REVIEW_SEND_FEISHU == 'true' }}
      REVIEW_TIMEOUT: ${{ vars.AI_REVIEW_TIMEOUT_SECONDS || '480' }}
    steps:
      - name: Check out the pushed commits
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.1'
      - name: Prepare cached Pi dependencies
        id: pi
        working-directory: review
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          runtime=$(node -p '[process.platform, process.arch, process.version].join("-")')
          dependency_hash=$(sha256sum package.json package-lock.json | sha256sum | cut -d ' ' -f 1)
          pi_cache="$HOME/.cache/ai-commit-review/pi/$runtime/$dependency_hash"
          mkdir -p "$pi_cache"
          exec 9>"$pi_cache/install.lock"
          flock 9
          if [[ -f "$pi_cache/.ready" ]]; then
            echo 'Using cached Pi dependencies'
          else
            cp package.json package-lock.json "$pi_cache/"
            npm ci --prefix "$pi_cache" --ignore-scripts --no-fund --no-audit
            touch "$pi_cache/.ready"
          fi
          printf '%s\n' "$pi_cache/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Review commits and send Feishu report
        run: python3 -B review/review_notify.py
      - name: Report Runner setup failure
        if: >-
          failure() && env.SEND_FEISHU == 'true' && steps.checkout.outcome == 'success' &&
          (steps.node.outcome == 'failure' || steps.pi.outcome == 'failure')
        env:
          REVIEW_SETUP_ERROR: ${{ steps.node.outcome == 'failure' && '准备 Node.js' || '安装 Pi' }}
        run: python3 -B review/review_notify.py
